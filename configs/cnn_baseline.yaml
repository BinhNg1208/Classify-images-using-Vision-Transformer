
# ResNet nhỏ, baseline cùng số tham số với ViT.
# Phần data và train giống vit_small.yaml.

run_name: cnn_baseline
seed: 42

data:
  name: tiny_imagenet
  root: data/tiny-imagenet-200
  cache_dir: data/cache/tiny_imagenet_64
  img_size: 64
  num_classes: 200
  batch_size: 64
  num_workers: 4
  val_ratio: 0.1
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  randaugment: true
  random_erasing: 0.0

model:
  name: resnet_small
  widths: [64, 128, 256, 512]
  blocks: [1, 2, 2, 1]
  stem_stride: 2

train:
  epochs: 50
  optimizer: adamw
  lr: 2.5e-4
  weight_decay: 0.05
  warmup_epochs: 5
  min_lr: 1.0e-5
  label_smoothing: 0.1
  grad_clip: 1.0
  amp: true
  mixup_alpha: 0.8
  cutmix_alpha: 1.0
  mix_prob: 0.5
